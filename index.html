<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pro Visualizer Studio</title>

<style>
body {
  margin:0;
  background:#000;
  font-family:sans-serif;
  color:white;
  text-align:center;
}

.controls {
  position:fixed;
  top:0;
  width:100%;
  background:#111;
  padding:10px;
  z-index:10;
}

canvas, video {
  position:absolute;
  top:0;
  left:0;
}

input, button, select {
  margin:4px;
}
</style>
</head>

<body>

<div class="controls">

<input type="file" id="audio" accept="audio/*">
<input type="file" id="bgImg" accept="image/*">
<input type="file" id="bgVideo" accept="video/*">

<br>

Color <input type="color" id="color" value="#00ffff">
Bars <input type="range" id="bars" min="32" max="256" value="128">

<br>

Size:
<select id="size">
<option value="1280x720">YouTube (16:9)</option>
<option value="1080x1920">Shorts (9:16)</option>
<option value="custom">Custom</option>
</select>

W <input type="number" id="w" value="1280">
H <input type="number" id="h" value="720">

<br>

Timeline <input type="range" id="timeline" value="0" step="0.01">

<br>

<button onclick="startRec()">Start Record</button>
<button onclick="stopRec()">Stop & Download</button>

</div>

<video id="videoBg" loop muted></video>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let audioCtx = new AudioContext();
let analyser = audioCtx.createAnalyser();

let audioEl = new Audio();
let source;

let dataArray;
let color="#00ffff";
let bars=128;

let bgImg=null;
let videoBg=document.getElementById("videoBg");

let recorder, chunks=[];

// SIZE CONTROL
function setSize(w,h){
  canvas.width=w;
  canvas.height=h;
  videoBg.width=w;
  videoBg.height=h;
}
setSize(1280,720);

document.getElementById("size").onchange=(e)=>{
  if(e.target.value==="custom") return;
  let [w,h]=e.target.value.split("x");
  setSize(w,h);
}

// AUDIO
audio.onchange=e=>{
  audioEl.src=URL.createObjectURL(e.target.files[0]);
  audioEl.play();

  source=audioCtx.createMediaElementSource(audioEl);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);

  analyser.fftSize=256;
  dataArray=new Uint8Array(analyser.frequencyBinCount);

  animate();
};

// BG IMAGE
bgImgInput.onchange=e=>{
  let r=new FileReader();
  r.onload=()=>{
    bgImg=new Image();
    bgImg.src=r.result;
  }
  r.readAsDataURL(e.target.files[0]);
};

// BG VIDEO
bgVideo.onchange=e=>{
  videoBg.src=URL.createObjectURL(e.target.files[0]);
  videoBg.play();
};

// COLOR + BARS
color.oninput=e=>color=e.target.value;
bars.oninput=e=>bars=e.target.value;

// TIMELINE
timeline.oninput=e=>{
  audioEl.currentTime=e.target.value;
};

audioEl.ontimeupdate=()=>{
  timeline.max=audioEl.duration;
  timeline.value=audioEl.currentTime;
};

// RECORD
function startRec(){
  let stream=canvas.captureStream(30);
  recorder=new MediaRecorder(stream);

  recorder.ondataavailable=e=>chunks.push(e.data);

  recorder.onstop=()=>{
    let blob=new Blob(chunks,{type:"video/mp4"});
    let a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="visualizer.mp4";
    a.click();
  };

  recorder.start();
}

function stopRec(){
  recorder.stop();
}

// DRAW
function animate(){
  requestAnimationFrame(animate);

  analyser.getByteFrequencyData(dataArray);

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // VIDEO BG
  if(videoBg.src){
    ctx.drawImage(videoBg,0,0,canvas.width,canvas.height);
  }

  // IMAGE BG
  if(bgImg){
    ctx.drawImage(bgImg,0,0,canvas.width,canvas.height);
  }

  let barWidth=canvas.width/bars;

  for(let i=0;i<bars;i++){
    let val=dataArray[i];
    let h=val*2;

    ctx.fillStyle=color;
    ctx.fillRect(i*barWidth,canvas.height-h,barWidth-2,h);
  }
}
</script>

</body>
</html>
